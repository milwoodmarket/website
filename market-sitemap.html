<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>This Week's Vendors &#8212; Milwood Market</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream:   #F5F0E8;
      --tan:     #E8DCC8;
      --brown:   #6B4C2A;
      --rust:    #C4521A;
      --green:   #3A5C3B;
      --gold:    #D4A843;
      --charcoal:#2C2416;
      --white:   #FDFAF4;
      --ff-display: 'Playfair Display', Georgia, serif;
      --ff-body:    'Lato', sans-serif;
    }
    body {
      font-family: var(--ff-body);
      background-color: var(--cream);
      color: var(--charcoal);
    }
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2.5rem;
      background: rgba(245,240,232,0.97);
      border-bottom: 1px solid var(--tan);
    }
    .nav-logo {
      font-family: var(--ff-display);
      font-weight: 900;
      font-size: 1.3rem;
      color: var(--brown);
      text-decoration: none;
    }
    .page-header {
      text-align: center;
      padding: 4rem 2rem 2rem;
    }
    .section-label {
      font-family: var(--ff-body);
      font-weight: 700;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--rust);
      margin-bottom: 0.6rem;
    }
    .page-title {
      font-family: var(--ff-display);
      font-weight: 900;
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      color: var(--charcoal);
      line-height: 1.05;
    }
    .page-title em { font-style: italic; color: var(--green); }
    .divider {
      width: 56px; height: 3px;
      background: var(--gold);
      margin: 1.2rem auto 1.5rem;
    }
    .page-intro {
      font-size: 1rem;
      color: #4A3C28;
      max-width: 560px;
      margin: 0 auto;
      line-height: 1.7;
    }

    /* Vendor grid */
    .content-wrapper {
      max-width: 900px;
      margin: 2rem auto 5rem;
      padding: 0 2rem;
    }
    .vendor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .vendor-card {
      background: var(--white);
      border: 1px solid var(--tan);
      border-top: 3px solid var(--green);
      border-radius: 12px;
      padding: 1.4rem 1.6rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .vendor-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(44,36,22,0.08);
    }
    .vendor-name {
      font-family: var(--ff-display);
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--brown);
      margin-bottom: 0.25rem;
      line-height: 1.2;
    }
    .vendor-desc {
      font-size: 0.88rem;
      color: #4A3C28;
      line-height: 1.5;
      margin-bottom: 0.6rem;
    }
    .vendor-handle {
      font-size: 0.8rem;
      color: #9A8060;
      font-weight: 700;
    }
    .vendor-handle a {
      color: var(--rust);
      text-decoration: none;
    }
    .vendor-handle a:hover { text-decoration: underline; }

    /* Sponsor card */
    .vendor-card.sponsor {
      grid-column: 1 / -1;
      background: #4c3121;
      border: none;
      border-top: 3px solid var(--gold);
    }
    .vendor-card.sponsor:hover {
      box-shadow: 0 6px 24px rgba(44,36,22,0.22);
    }
    .sponsor-badge {
      display: inline-block;
      font-family: var(--ff-body);
      font-weight: 700;
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #4c3121;
      background: var(--gold);
      border-radius: 3px;
      padding: 0.2rem 0.55rem;
      margin-bottom: 0.75rem;
    }
    .sponsor-inner {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    .vendor-card.sponsor .vendor-name {
      color: var(--white);
      font-size: 1.3rem;
    }
    .vendor-card.sponsor .vendor-desc {
      color: rgba(253,250,244,0.75);
      margin-bottom: 0;
    }
    .sponsor-links {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      align-items: flex-end;
      flex-shrink: 0;
    }
    .sponsor-links a {
      font-family: var(--ff-body);
      font-weight: 700;
      font-size: 0.78rem;
      color: var(--gold);
      text-decoration: none;
      white-space: nowrap;
    }
    .sponsor-links a:hover { text-decoration: underline; }

/* Sitemp */
.sitemap {
display: flex;
justify-content: center;
padding: 40px 0px 120px 0px;
}

.sitemap img {
width: 50%;
border: 2px solid var(--gold);
}

    /* Food truck cards */
    .vendor-card.food-truck {
      background: #EDE5D8;
      border-top-color: var(--rust);
    }
    .food-truck-label {
      font-family: var(--ff-body);
      font-weight: 700;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--rust);
      margin-bottom: 0.35rem;
    }

    footer {
      background: var(--charcoal);
      padding: 2rem;
      text-align: center;
    }
    .footer-logo {
      font-family: var(--ff-display);
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--white);
    }
    .footer-logo em { font-style: italic; color: var(--gold); }

    @media (max-width: 600px) {
      .vendor-grid { grid-template-columns: 1fr; }
      .sponsor-inner { flex-direction: column; }
      .sponsor-links { align-items: flex-start; }
    }
  </style>
</head>
<body>

<nav>
  <span class="nav-logo">Milwood Market</span>
  <a href="https://www.milwoodmarket.com" style="font-family:var(--ff-body);font-weight:700;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--brown);text-decoration:none;transition:color 0.2s;" onmouseover="this.style.color='#C4521A'" onmouseout="this.style.color='#6B4C2A'">Go to milwoodmarket.com &#x2192;</a>
</nav>

<div class="page-header">
  <p class="section-label">This Week</p>
  <h1 class="page-title">Market <em>Sitemap</em></h1>
  <div class="divider"></div>
  <p class="page-intro">Plan your visit with a full overview of the market setup, including shopping areas, food trucks, live music, and seating.</p>
</div>

<!-- Map -->
<div class="sitemap">
<img src="images/market-sitemap.png">
</div>

<footer>
  <div class="footer-logo">Milwood <em>Market</em></div>
</footer>

</body>
</html>
